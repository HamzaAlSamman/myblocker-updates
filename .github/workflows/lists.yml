name: Mirror block lists
# Copies HaGeZi's lists here every day, so phones on networks that block
# raw.githubusercontent.com can still fetch them (through api.github.com / jsDelivr).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          base=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard
          get() {
            curl -fsSL --retry 3 "$base/$1" -o "lists/$2.tmp"
            # sanity check: a real list has thousands of entries
            [ "$(grep -vc '^#' "lists/$2.tmp")" -gt 10000 ] || { echo "$1 too small"; exit 1; }
            mv "lists/$2.tmp" "lists/$2"
          }
          mkdir -p lists
          get pro-onlydomains.txt hagezi-pro.txt
          get popupads-onlydomains.txt hagezi-popup.txt
      - name: Commit
        run: |
          git config user.name "lists-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update block lists"
          git push
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/lists/hagezi-pro.txt" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/lists/hagezi-popup.txt" || true
